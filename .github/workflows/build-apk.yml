name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: App icons and splash
        run: npx capacitor-assets generate --android --assetPath assets
      - name: Sync config
        run: npx cap sync android
      - name: Version number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KRS-Portal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KRS-Portal-Android
          path: KRS-Portal.apk
